<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/chatbot-style.css">

    <title>Chatbot</title>
    <style>
        /* Example CSS for chatbox */
        #chatbox-popup {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 300px;
            height: 400px;
            position: fixed;
            bottom: 20px;
            right: 20px;
            border: 1px solid #ccc;
            background-color: #fff;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #chatbox {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .message {
            margin-bottom: 10px;
        }

        .user-message {
            text-align: right;
            color: blue;
        }

        .bot-message {
            text-align: left;
            color: green;
        }

        #input-container {
            padding: 10px;
        }

        #input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #open-chat, #close-chat {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 20px;
            background-color: #ff6347;
            color: white;
            border: none;
            border-radius: 50%;
            padding: 10px 15px;
            cursor: pointer;
        }

        #close-chat {
            display: none;
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body style="background-image: url(static/img/bg.jpg);">
    <div class="banner-area">
        <header>
            <h1><a href="{{ url_for('index') }}" class="logo">JakapatSteakHouse</a></h1>
            <ul class="menu">
                <h2><a href="{{ url_for('index') }}">Home</a></h2>
                <h2><a href="{{ url_for('check') }}">Main</a></h2>
                <h2><a href="{{ url_for('chatbot') }}">Chatbot</a></h2>
                <h2><a href="{{ url_for('team') }}">Team</a></h2>
            </ul>
        </header>
    </div>

    <button id="open-chat">💬</button>
    <button id="close-chat">✖</button>

    <div id="chatbox-popup">
        <div id="chatbox"></div>
        <div id="input-container">
            <input id="input" type="text" placeholder="Type your message...">
        </div>
    </div>

    <script>
        const chatboxPopup = document.getElementById('chatbox-popup');
        const openChatButton = document.getElementById('open-chat');
        const closeChatButton = document.getElementById('close-chat');
        const chatbox = document.getElementById('chatbox');
        const input = document.getElementById('input');

        openChatButton.addEventListener('click', () => {
            chatboxPopup.style.display = 'flex';
            openChatButton.style.display = 'none';
            closeChatButton.style.display = 'block';
        });

        closeChatButton.addEventListener('click', () => {
            chatboxPopup.style.display = 'none';
            openChatButton.style.display = 'block';
            closeChatButton.style.display = 'none';
        });

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const message = input.value.trim();
                if (message) {
                    chatbox.innerHTML += `<div class="message user-message">${message}</div>`;
                    input.value = '';

                    try {
                        const response = await fetch('/chatbot/webhook', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ message })
                        });
                        const botMessages = await response.json();
                        botMessages.forEach(msg => {
                            if (msg.text) {
                                chatbox.innerHTML += `<div class="message bot-message">${msg.text}</div>`;
                            }
                            if (msg.image) {
                                chatbox.innerHTML += `<div class="message bot-message"><img src="${msg.image}" alt="Image"></div>`;
                            }
                        });
                    } catch (error) {
                        console.error('Error sending message to Rasa:', error);
                        chatbox.innerHTML += `<div class="message bot-message">Error connecting to the server.</div>`;
                    }

                    chatbox.scrollTop = chatbox.scrollHeight;
                }
            }
        });
    </script>
</body>
</html>
